[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-pic-collision-operators"
version = "0.1.0"
description = "Machine learning algorithms to learn collision operators from Particle-in-Cell (PIC) simulations."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Diogo Carvalho", email = "diogo.d.carvalho@tecnico.ulisboa.pt"}
]
keywords = ["plasma-physics", "machine-learning", "PIC", "pytorch"]

# General dependencies (platform agnostic)
dependencies = [
    "mlflow",
    "torch",
    "torchvision",
    "tqdm",
    "h5py",
    "pandas",
    "tables",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[project.urls]
"Homepage" = "https://github.com/diogodcarvalho/ml-pic-collision-operators"

[project.scripts]
mlpic_run = "ml_pic_collision_operators.main:main"

[tool.setuptools]
include-package-data = true

[tool.coverage.run]
# DDP tests run each rank in an mp.spawn subprocess. multiprocessing concurrency
# is required for coverage to instrument those workers, not just the main process.
concurrency = ["multiprocessing"]
parallel = true  # each rank writes its own data file. pytest-cov combines them.
sigterm = true  # flush a worker's data if mp.spawn terminates it on error.
branch = true  # set here so mp.spawn workers match the main process and combine.
source = ["ml_pic_collision_operators"]